<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MVHS Java Practice Final Exam</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-ui-mode="classic">
    <div class="exam-shell">
      <header class="site-header">
        <div class="header-left">
          <h1>MVHS Java practice final exam website (By James Liu the best TA)</h1>
        </div>
        <div class="header-actions">
          <button
            id="reset-button"
            class="reset-button secondary"
            type="button"
          >
            Reset
          </button>
          <button
            id="ui-mode-toggle"
            class="ui-mode-toggle secondary"
            type="button"
            aria-pressed="false"
          >
            <span id="ui-mode-toggle-label">AP Exam-Style Mode</span>
          </button>
        </div>
      </header>

      <main class="page">
        <section id="quiz-view" class="quiz-view" aria-live="polite">
          <div class="exam-workspace">
            <section class="prompt-pane" aria-labelledby="chapter-label">
              <div class="quiz-meta">
                <span id="chapter-label"></span>
                <span id="question-count"></span>
              </div>

              <div class="progress-track" aria-hidden="true">
                <div id="progress-fill" class="progress-fill"></div>
              </div>

              <div class="prompt-content">
                <div class="question-heading">
                  <span id="section-label"></span>
                  <span id="question-mode"></span>
                </div>
                <div id="question-text" class="question-text"></div>
              </div>
            </section>

            <div class="workspace-divider" aria-hidden="true"></div>

            <article class="question-panel">
              <div class="answer-toolbar">
                <div id="question-number-badge" class="question-number">1</div>
                <button
                  id="mark-button"
                  class="mark-button"
                  type="button"
                  aria-pressed="false"
                >
                  <svg
                    class="bookmark-icon"
                    aria-hidden="true"
                    focusable="false"
                    viewBox="0 0 24 32"
                  >
                    <path
                      d="M5 4.5h14v23l-7-4.75-7 4.75z"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2.5"
                    />
                  </svg>
                  <span id="mark-button-label">Mark for Review</span>
                </button>
              </div>

              <h2 id="answer-instructions" class="answer-instructions">
                Select one answer.
              </h2>
              <fieldset id="choices" class="choices"></fieldset>
              <p id="feedback" class="feedback" hidden></p>
            </article>
          </div>

          <div id="inline-actions-mount" class="inline-actions-mount">
            <div id="quiz-actions" class="actions">
              <button id="previous-button" type="button" class="secondary">
                Back
              </button>
              <button id="check-button" type="button" class="secondary">
                Check answer
              </button>
              <button id="next-button" type="button">Next</button>
            </div>
          </div>
        </section>

        <section id="dashboard-view" class="dashboard-view" hidden>
          <div class="dashboard-header">
            <div>
              <span class="dashboard-eyebrow">Practice complete</span>
              <h2>Results</h2>
            </div>
            <button id="restart-button" type="button" class="secondary">
              Start over
            </button>
          </div>

          <div id="stats" class="stats"></div>

          <section class="summary-section">
            <h3>By chapter</h3>
            <div id="chapter-summary" class="chapter-summary"></div>
          </section>

          <section class="summary-section">
            <h3>Missed or skipped</h3>
            <div id="missed-list" class="missed-list"></div>
          </section>
        </section>
      </main>

      <div id="jump-backdrop" class="jump-backdrop" hidden></div>
      <nav id="jump-dock" class="jump-dock" aria-label="Question navigation">
        <section
          id="jump-panel"
          class="jump-panel"
          aria-label="Jump to question"
          hidden
        >
          <div class="jump-panel-header">
            <strong>Question overview</strong>
            <span id="jump-panel-count"></span>
          </div>
          <div id="jump-grid" class="jump-grid"></div>
        </section>

        <div class="jump-bar">
          <div class="practice-info">
            <button
              type="button"
              class="practice-info-trigger"
              aria-label="Practice tool information"
              aria-describedby="practice-info-tooltip"
            >
              <span aria-hidden="true">i</span>
            </button>
            <span id="practice-info-tooltip" class="practice-info-tooltip" role="tooltip">
              This is an independent practice tool. It is not affiliated with, endorsed by, or sponsored by College Board or Bluebook.
            </span>
          </div>

          <button
            id="jump-toggle"
            type="button"
            class="question-pill"
            aria-expanded="false"
            aria-controls="jump-panel"
          >
            <span id="jump-current">Question 1 of 199</span>
            <span id="jump-toggle-label" aria-hidden="true"></span>
          </button>

          <div id="dock-actions-mount" class="dock-actions-mount"></div>
        </div>
      </nav>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
